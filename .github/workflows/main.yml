name: Deploy HORA Astrology

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for formula QA
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full test suite (diagnostic)
        run: npm test
        continue-on-error: true

      - name: Run required core, Ketu, and Thai lunar recheck tests
        run: node --test qa/formula-tests/core.test.js qa/formula-tests/ketu-679-month88.test.js qa/formula-tests/thai-lunar-backup-recheck.test.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
