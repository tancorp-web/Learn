name: Deploy HORA Astrology

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # HORA เป็นเว็บ static ไม่ต้อง build ถ้ามี npm build ค่อยเพิ่มทีหลัง
      - name: Upload HORA folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './HORA'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
